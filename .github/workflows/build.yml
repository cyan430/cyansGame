name: Build EasyX with g++

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 MSYS2 / MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: 编译
        shell: msys2 {0}
        run: |
          g++ -std=c++17 -O2 -Wall \
              allgame.cpp -o app.exe \
              -I easyx/include \
              -L easyx/lib64 \
              -leasyx -lgdi32 -lole32 \
              -static -static-libgcc -static-libstdc++

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: easyx-app
          path: app.exe
