name: Build EasyX with g++

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-toolchain

      - name: 环境信息（排错用）
        run: |
          which g++
          g++ --version
          echo "=== include ==="; ls -la easyx/include
          echo "=== lib64 ==="; ls -la easyx/lib64
          # 看库架构，期望 pe-x86-64
          for f in easyx/lib64/*.a; do echo "-- $f"; objdump -f "$f" | head -n 3; done

      - name: 编译
        run: |
          g++ allgame.cpp \
            -I easyx/include \
            -L easyx/lib64 \
            -leasyx \
            -lgdi32 -lole32 -lwinmm -lwinhttp -lbcrypt \
            -static-libgcc -static-libstdc++ \
            -o app.exe
          # 如果代码用 Unicode/TCHAR 版，可改 -leasyxw

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: easyx-app
          path: app.exe
