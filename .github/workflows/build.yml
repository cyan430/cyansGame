name: Build C++ (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 MSYS2 / MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make

      - name: 用 g++ 编译
        shell: msys2 {0}
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra \
              src/main.cpp -o app.exe \
              -static -static-libgcc -static-libstdc++ \
              -luser32 -lgdi32 -lkernel32

      - name: 上传可执行文件
        uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: app.exe
